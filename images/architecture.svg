<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 420" width="940" height="420" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#58a6ff"/>
    </marker>
  </defs>

  <rect width="940" height="420" fill="#0d1117"/>

  <!-- host boundary -->
  <rect x="20" y="30" width="900" height="330" rx="10" fill="none" stroke="#30363d" stroke-dasharray="6 5"/>
  <text x="36" y="54" fill="#8b949e" font-size="12" letter-spacing="1.5">HOST MACHINE (UBUNTU)</text>

  <!-- browser -->
  <rect x="52" y="128" width="176" height="126" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="140" y="166" fill="#e6edf3" font-size="14" text-anchor="middle">Browser UI</text>
  <text x="140" y="188" fill="#8b949e" font-size="11" text-anchor="middle">localhost:7331</text>
  <text x="140" y="212" fill="#8b949e" font-size="11" text-anchor="middle">(or MCP Inspector)</text>
  <text x="140" y="234" fill="#3fb950" font-size="11" text-anchor="middle">127.0.0.1 only</text>

  <!-- docker boundary -->
  <rect x="272" y="76" width="620" height="262" rx="10" fill="none" stroke="#30363d" stroke-dasharray="4 4"/>
  <text x="288" y="98" fill="#8b949e" font-size="11" letter-spacing="1.2">DOCKER</text>

  <!-- container -->
  <rect x="300" y="112" width="566" height="200" rx="8" fill="#0f1a12" stroke="#2ea043"/>
  <text x="316" y="136" fill="#3fb950" font-size="12" letter-spacing="1">UBUNTU 24.04 — DISPOSABLE CONTAINER</text>

  <!-- server.js -->
  <rect x="324" y="160" width="182" height="96" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="415" y="190" fill="#e6edf3" font-size="13" text-anchor="middle">server.js</text>
  <text x="415" y="210" fill="#8b949e" font-size="10.5" text-anchor="middle">MCP server</text>
  <text x="415" y="228" fill="#8b949e" font-size="10.5" text-anchor="middle">JSON-RPC 2.0</text>
  <text x="415" y="246" fill="#58a6ff" font-size="10.5" text-anchor="middle">run_command</text>

  <!-- bash -->
  <rect x="548" y="160" width="122" height="96" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="609" y="196" fill="#e6edf3" font-size="13" text-anchor="middle">bash</text>
  <text x="609" y="216" fill="#8b949e" font-size="10.5" text-anchor="middle">-lc "cmd"</text>
  <text x="609" y="236" fill="#8b949e" font-size="10.5" text-anchor="middle">uid 0 (root)</text>

  <!-- filesystem -->
  <rect x="712" y="160" width="132" height="96" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="778" y="190" fill="#e6edf3" font-size="12" text-anchor="middle">filesystem</text>
  <text x="778" y="210" fill="#8b949e" font-size="10.5" text-anchor="middle">/INSIDE_</text>
  <text x="778" y="225" fill="#8b949e" font-size="10.5" text-anchor="middle">CONTAINER.txt</text>
  <text x="778" y="243" fill="#8b949e" font-size="10.5" text-anchor="middle">/app/server.js</text>

  <!-- arrows -->
  <line x1="228" y1="191" x2="318" y2="191" stroke="#58a6ff" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="273" y="182" fill="#58a6ff" font-size="10" text-anchor="middle">HTTP</text>

  <line x1="506" y1="208" x2="542" y2="208" stroke="#58a6ff" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="524" y="200" fill="#58a6ff" font-size="9.5" text-anchor="middle">spawn</text>

  <line x1="670" y1="208" x2="706" y2="208" stroke="#58a6ff" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="688" y="200" fill="#58a6ff" font-size="9.5" text-anchor="middle">r/w</text>

  <!-- no-host-mount note -->
  <text x="583" y="292" fill="#f85149" font-size="11" text-anchor="middle">no host mount · no docker socket · nothing of yours inside</text>

  <!-- footer -->
  <text x="470" y="392" fill="#8b949e" font-size="11" text-anchor="middle">Browser talks to the container over loopback; the container never sees the host filesystem.</text>
</svg>
